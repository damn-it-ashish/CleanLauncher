name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$S" ]; then echo "settings.gradle not found in repo"; find . -not -path './.git/*' | head -50; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CleanLauncher-apk
          path: '**/build/outputs/apk/release/*.apk'
